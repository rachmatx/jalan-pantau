<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman Tidak Ditemukan | JalanPantau</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23006194'/%3E%3Cpath d='M10 22 L14 10 L18 10 L14 22 Z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root { --navy:#0F1E33; --blue:#006194; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:"Segoe UI",system-ui,sans-serif; background:var(--navy);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      color:#0F172A;
    }
    .card {
      background:#fff; border-radius:16px; padding:40px 36px; max-width:420px;
      width:90%; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.45);
    }
    .ico {
      width:64px; height:64px; margin:0 auto 18px; border-radius:16px;
      background:#EFF4FF; display:flex; align-items:center; justify-content:center;
      font-family:ui-monospace,Consolas,monospace; font-size:22px; font-weight:800;
      color:var(--blue);
    }
    h1 { font-size:20px; margin-bottom:8px; color:var(--navy); }
    p { font-size:14px; color:#475569; line-height:1.6; margin-bottom:24px; }
    a {
      display:inline-block; background:var(--blue); color:#fff; text-decoration:none;
      padding:11px 26px; border-radius:10px; font-size:14px; font-weight:600;
    }
    a:hover { background:#00456b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ico">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Alamat yang Anda tuju tidak ada di aplikasi ini. Periksa kembali
       alamatnya, atau kembali ke halaman utama untuk mulai inspeksi.</p>
    <a href="/">Kembali ke Halaman Utama</a>
  </main>
</body>
</html>
