<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} | Ruang Kontraktor {{ profil.kode }} &mdash; JalanPantau</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}?v={{ static_v }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dash.css') }}?v={{ static_v }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%230F766E'/%3E%3Cpath d='M9 11h14v4H9z' M9 18h9v4H9z' fill='%23fff'/%3E%3C/svg%3E">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  
</head>
<body class="dash">
  <!-- Sidebar (di layar kecil dibuka lewat tombol menu) -->
  <button type="button" class="dash-nav-toggle" id="nav-toggle"
          aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="dash-nav-scrim" id="nav-scrim" hidden></div>
  <aside class="dash-sidebar" id="sidebar">
    <div class="dash-brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#0F766E"/><path d="M9 11h14v4H9z" fill="#fff"/><path d="M9 18h9v4H9z" fill="#fff"/></svg>
      <div>
        <div class="dash-brand-name">JalanPantau</div>
        <div class="dash-brand-sub">Kontraktor {{ profil.kode }}</div>
      </div>
    </div>
    <nav class="dash-nav">
      <a href="/kontraktor/dashboard" class="{{ 'aktif' if active == 'dashboard' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Beranda</span>
      </a>
      <a href="/kontraktor/spk" class="{{ 'aktif' if active == 'spk' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>SPK Saya</span>
      </a>
      <a href="/kontraktor/peta" class="{{ 'aktif' if active == 'peta' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v12h22V6H1z"/><path d="M7 18V6M7 12l5-4 5 4 5-3"/></svg>
        <span>Peta Tugas</span>
      </a>
    </nav>
    <div class="dash-sidebar-footer">
      <div class="dash-admin-info">
        <span class="dash-admin-name">{{ profil.nama }}</span>
        <span class="dash-admin-role">Kontraktor {{ profil.kode }}</span>
      </div>
      <a href="/logout" class="dash-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Keluar</span>
      </a>
      <a href="/" class="dash-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Halaman Publik JalanPantau</span>
      </a>
    </div>
  </aside>

  <main class="dash-main">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/dash.js') }}?v={{ static_v }}"></script>
  

  

  <!-- Navigasi layar kecil, sama seperti di dashboard dinas. -->
  
<script src="{{ url_for('static', filename='js/jp_core.js') }}?v={{ static_v }}"></script>
  {% block skrip %}{% endblock %}
</body>
</html>
