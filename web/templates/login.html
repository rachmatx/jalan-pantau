<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | JalanPantau</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}?v={{ static_v }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23006194'/%3E%3Cpath d='M10 22 L14 10 L18 10 L14 22 Z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scrollbar-gutter:stable}
    body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;color:#0F172A;
      background:linear-gradient(135deg,#006194 0%,#003f61 100%);position:relative}
    body::before{content:"";position:absolute;inset:0;
      background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:28px 28px;pointer-events:none}
    .login-wrap{width:100%;max-width:420px;margin:auto}
    .login-card{position:relative;z-index:1;background:#fff;border-radius:12px;
      box-shadow:0 12px 40px rgba(0,0,0,.35);padding:40px 36px;width:100%}
    .login-logo{display:flex;justify-content:center;margin-bottom:14px}
    .login-card h1{font-size:22px;text-align:center;margin:0 0 4px}
    .login-sub{font-size:13px;color:#475569;text-align:center;margin:0 0 20px}
    .login-galat{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;
      border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center;
      overflow-wrap:break-word}
    .login-card label{display:block;font-size:13px;font-weight:600;color:#334155;margin:14px 0 6px}
    .login-card input{width:100%;padding:11px 14px;border:1px solid #CBD5E1;
      border-radius:8px;font-size:16px;background:#F8FAFC;min-height:44px}
    .login-card input:focus{outline:2px solid rgba(0,97,148,.35);border-color:#006194}
    .login-btn{width:100%;margin-top:22px;padding:12px;background:#006194;color:#fff;
      border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
      transition:background .15s}
    .login-btn:hover{background:#004d78}
    .login-petunjuk{margin-top:22px;padding:14px;background:#F8FAFC;
      border:1px solid #E2E8F0;border-radius:8px}
    .login-petunjuk-judul{margin:0 0 8px;font-size:12px;font-weight:700;
      letter-spacing:.06em;text-transform:uppercase;color:#475569}
    .login-petunjuk dl{margin:0;display:grid;grid-template-columns:auto 1fr;
      gap:4px 10px;font-size:12px}
    .login-petunjuk dt{font-weight:600;color:#334155;white-space:nowrap}
    .login-petunjuk dd{margin:0;color:#475569}
    .login-petunjuk code{font-family:ui-monospace,Consolas,monospace;
      font-size:12px;background:#E2E8F0;color:#0F172A;padding:1px 5px;
      border-radius:4px}
    .login-petunjuk-catatan{margin:10px 0 0;padding-top:10px;
      border-top:1px solid #E2E8F0;font-size:12px;color:#475569}
    .pass-wrap{position:relative}
    .pass-wrap input{padding-right:48px}
    .pass-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);
      width:40px;height:44px;display:flex;align-items:center;justify-content:center;
      background:none;border:none;border-radius:8px;cursor:pointer;color:#64748B}
    .pass-eye:hover{color:#006194;background:#F1F5F9}
    .pass-eye:focus-visible{outline:2px solid rgba(0,97,148,.35)}
    .pass-eye svg{width:20px;height:20px}
    .login-back{text-align:center;margin:18px 0 0;font-size:13px}
    .login-back a{color:#006194;text-decoration:none;font-weight:600;display:inline-block;padding:6px 8px}
    .login-back a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-logo">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="7" fill="#006194"/>
          <path d="M10 22 L14 10 L18 10 L14 22 Z" fill="#fff"/>
        </svg>
      </div>
      <h1>Masuk</h1>
      <p class="login-sub">Masuk sebagai admin untuk mengelola kalibrasi dan riwayat.</p>

      {% if galat %}<div class="login-galat" role="alert">{{ galat }}</div>{% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" placeholder="admin">

        <label for="password">Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" name="password" required
                 autocomplete="current-password" placeholder="Password">
          <button type="button" class="pass-eye" id="pass-eye"
                  aria-label="Tampilkan password" aria-pressed="false">
            <svg id="ikon-mata-buka" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="ikon-mata-tutup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3.5 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg>
          </button>
        </div>

        <button type="submit" class="login-btn">Masuk</button>
      </form>
      <script>
        (function () {
          var btn = document.getElementById('pass-eye');
          var inp = document.getElementById('password');
          var buka = document.getElementById('ikon-mata-buka');
          var tutup = document.getElementById('ikon-mata-tutup');
          btn.addEventListener('click', function () {
            var terlihat = inp.type === 'text';
            inp.type = terlihat ? 'password' : 'text';
            buka.style.display = terlihat ? '' : 'none';
            tutup.style.display = terlihat ? 'none' : '';
            btn.setAttribute('aria-pressed', String(!terlihat));
            btn.setAttribute('aria-label', terlihat ? 'Tampilkan password' : 'Sembunyikan password');
            inp.focus();
          });
        })();
      </script>

      <p class="login-back"><a href="/">Kembali ke halaman utama</a></p>
    </section>
  </main>
</body>
</html>
