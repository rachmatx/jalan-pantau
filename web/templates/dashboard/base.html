<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} | JalanPantau PUPR {{ nama_daerah }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dash.css') }}?v={{ static_v }}">
</head>
<body class="dash">
  <!-- Sidebar -->
  <aside class="dash-sidebar" id="sidebar">
    <div class="dash-brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#3b82f6"/><path d="M10 22 L14 10 L18 10 L14 22 Z" fill="#fff"/></svg>
      <div>
        <div class="dash-brand-name">JalanPantau</div>
        <div class="dash-brand-sub">PUPR {{ nama_daerah }}</div>
      </div>
    </div>
    <nav class="dash-nav">
      <a href="/pupr-{{ daerah }}/dashboard" class="{{ 'aktif' if active == 'dashboard' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/pupr-{{ daerah }}/dashboard/disposisi" class="{{ 'aktif' if active == 'disposisi' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Disposisi</span>
      </a>
      <a href="/pupr-{{ daerah }}/dashboard/instansi" class="{{ 'aktif' if active == 'instansi' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01"/></svg>
        <span>Instansi</span>
      </a>
    </nav>
    <div class="dash-sidebar-footer">
      <div class="dash-admin-info">
        <span class="dash-admin-name">{{ session.get('admin_user', 'admin') }}</span>
        <span class="dash-admin-role">{{ 'Superadmin' if session.get('admin_daerah') == '-' else 'Admin Dinas' }}</span>
      </div>
      <a href="/logout" class="dash-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Keluar</span>
      </a>
      <a href="/" class="dash-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Kembali ke JalanPantau</span>
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="dash-main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/dash.js') }}?v={{ static_v }}"></script>
  {% block skrip %}{% endblock %}
</body>
</html>
