# Parameter inferensi YOLO — EDITABLE tanpa ubah kode.
# Diagnosis 2026-09-07 (3 foto 12 MP, best.pt CPU):
# - imgsz 960 menemukan 1,5-5x lebih banyak temuan vs 640, biaya hanya +0,2-0,4 dtk.
# - conf rendah (<0,25) menambah duplikat bertumpuk -> iou 0,5 menggabungkannya.
# Benchmark 2026-09-08 (paritas pt vs onnx dinamis: skor IDENTIK 4 desimal;
# 1 box bisa flip di batas NMS — wajar, acak, kecil):
# - gambar = best.pt + TTA (YOLOv11s: test RDD 0,470->0,526; recall naik,
#   precision turun sedikit); ONNX mengabaikan TTA -> TTA hanya untuk backend pt.
# 2026-10-16 (real-time, GTX 1650 + torch CUDA):
# - CPU i5-3470 cuma ~1,6 FPS (~600 ms/frame) -> box telat. Live dipindah ke
#   best.pt supaya bisa jalan di GPU (ONNX mengabaikan `device` tanpa
#   onnxruntime-gpu). best.onnx tetap ada sebagai fallback CPU.
# - device: auto = GPU bila CUDA tersedia, else CPU. Paksa: 0 / "0,1" / cpu.
# Berlaku mulai start/deteksi berikutnya (live baca ulang tiap start).
model_gambar: best.pt
model_live: best.pt
# Scene classifier (gate jalan basah): YOLOv11n-cls latih IROSCD (~5MB).
# Gate aktif bila probabilitas wet_road >= wet_min (bukan top-1), agar foto
# ambigu — jalan basah yang rusak, terklasifikasi "damaged" — tetap memicu
# gate. Model hilang = gate nonaktif otomatis (perilaku normal, tanpa error).
model_scene: scene_cls.pt
scene_gate:
  aktif: true
  wet_min: 0.25
  ambang_lubang: 0.45
device: auto
imgsz_gambar: 960
imgsz_live: 640  # 640 = akurasi penuh; 480/320 hanya bila mesin sangat lambat
iou: 0.5
tta: true  # augment=True; trial 3 foto: conf top naik konsisten (0.4x->0.8x), biaya 0.3s->0.7s. Matikan bila terlalu PD.
teliti:
  aktif_default: false
  tile: 640
  imgsz: 960  # resolusi inferensi PER TILE (terpisah dari `tile`); 640 membuat
              # model buta pada retak tipis (0 box vs 79 box @960, diag 17 Okt 2026)
  overlap: 0.25
  iou_gabung: 0.5
  metode_gabung: wbf  # nms | wbf (wbf melebur box bertumpuk lintas tile, lebih halus dari nms)
  buang_tepi_tile: true  # buang box terpotong tepi-dalam tile (duplikat lintas tile)
  iou_agnostik: 0.6  # NMS lintas kelas: satu kerusakan = satu box kelas pemenang
# Ensemble 2 model (tab Gambar saja): gabung box model_gambar + model_kedua
# via WBF/NMS per kelas. Default MATI (biaya ~2x waktu). Saat ini hanya ada
# satu model (best.pt), jadi model_kedua == model_gambar -> jalur tunggal.
ensemble:
  aktif: false
  model_kedua: best.pt
  iou: 0.5
  metode: wbf  # wbf | nms
# Saring akhir: buang box mungil (noise) + pagu baris per gambar.
saring:
  luas_min_px: 900  # luas box minimum dalam px citra asli (30x30); 0 = mati
  maks_temuan: 20  # simpan N conf tertinggi; 0 = tanpa batas
# Lebur fragmen: kepingan satu kerusakan besar digabung jadi satu box utuh
# (severity + biaya dihitung ulang; menghentikan dobel-hitung fragmen).
gabung_fragmen:
  aktif: true
  iou_min: 0.05
  inter_min: 0.3
  lintas_kelas: true
# Toleransi per kelas (relatif terhadap slider — slider tetap batas mutlak).
# Efektif = slider - toleransi. Retak tipis boleh lolos di bawah slider,
# tapi menaikkan slider selalu memperketat semua kelas.
# pothole 0.08 (2026-09-30): evaluasi BPID (161 gambar, 263 instance) menunjukkan
#   titik F1 optimal pothole ~conf 0.15-0.20; ambang efektif 0.17 (slider 0.25)
#   menaikkan recall tanpa menurunkan mAP. Lihat docs/Panduan-Tuning-Model.md §6.
toleransi_kelas:
  longitudinal_crack: 0.13
  transverse_crack: 0.13
  alligator_crack: 0.10
  other_corruption: 0.10
  pothole: 0.08
live:
  min_frames: 2  # track sah untuk snapshot bila terlihat >= N frame (redam kedip)
  display_fps: 30   # batas atas laju TAMPIL preview (terpisah dari laju inferensi)
  infer_interval: 1 # inferensi tiap N frame kamera (frame lain hanya ditampilkan)
  frame_diff_threshold: 0.02 # skip inferensi bila frame <2% berubah (webcam diam);
                             # 0 = mati; DIABAIKAN untuk sumber video (demo harus segar)
  jpeg_quality: 72  # kualitas JPEG preview (turun dari 85 -> encode lebih murah)
  display_width: 640 # lebar frame proses+tampil (px); kamera di-resize ke ini
  cam_width: 640     # resolusi capture webcam
  cam_height: 480
  cam_fps: 30
# Prior ukuran dari kalibrasi: tolak box yang mustahil secara fisik.
batas_ukuran:
  diameter_maks_cm: 300
  lebar_retak_maks_cm: 100
  luas_maks_m2: 100
  # Rasio aspek minimum (panjang/lebar) untuk retak longitudinal/transversal.
  # Box near-square berlabel retak hampir pasti false positive.
  rasio_aspek_min_retak: 1.5
