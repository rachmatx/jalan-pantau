# Seed kontraktor untuk alur SPK (dinas -> kontraktor -> bukti perbaikan).
#
# Daftar kontraktor di bawah adalah data awal: dibaca sekali saat aplikasi
# pertama kali jalan, lalu dapat disunting dari dashboard Dinas pada menu
# Kontraktor. Menjalankan ulang aplikasi TIDAK menimpa perubahan Anda,
# karena baris yang sudah ada dilewati.
#
# Kolom kontraktor:
#   kode       kode unik, huruf besar (mis. KT-001)
#   nama       nama badan usaha
#   nonaktif   true -> kontraktor tidak bisa login dan tidak muncul di
#              pilihan SPK pada dashboard Dinas
#
# Kolom akun:
#   username  nama login kontraktor (huruf kecil, unik, jangan pakai awalan pupr_)
#   sandi     isi bila ingin sandi tertentu. Kosongkan agar memakai sandi demo
#             yang sama dengan akun admin (env JP_DEMO_PASS bisa mengaturnya).
#   segel     true -> sandi acak tak-tertebak, akun TIDAK bisa login sampai
#             superadmin mengaturnya dari dashboard Dinas.

