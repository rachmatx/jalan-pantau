name: CI

on:
  push:
  pull_request:

# Batalkan run sebelumnya yang masih berjalan untuk commit yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependensi sistem (OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Pasang dependensi CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Jalankan test
        run: python -m unittest discover -s tests -v

      - name: Cek kontrak ID DOM (JS <-> template)
        run: python scripts/cek_id_dom.py

      # DESIGN.md melarang emoji sebagai ikon (inline SVG saja). Guard ini
      # fail-closed: tanpa argumen ia memindai tree default, dan keluar
      # non-zero bila tidak ada file yang diperiksa (tidak boleh hijau hampa).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cek zero-emoji
        run: node scripts/grep-emoji.cjs

      # Semua source & dokumen proyek ini latin. Aksara CJK atau Cyrillic
      # yang muncul hampir selalu salah ketik yang lolos review. Guard
      # fail-closed: keluar non-zero bila tidak ada file yang diperiksa.
      # Cakupannya termasuk README.md dan DESIGN.md di root, bukan hanya
      # isi direktori -- dokumen root justru yang paling sering diedit.
      - name: Cek zero-aksara-asing
        run: node scripts/grep-cjk.cjs