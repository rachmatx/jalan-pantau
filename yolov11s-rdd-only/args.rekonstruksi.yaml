# =====================================================================
# REKONSTRUKSI - BUKAN args.yaml asli dari Kaggle.
#
# Run YOLOv11s final tidak menyertakan args.yaml; isinya dipulihkan dari:
#   1. Panggilan model.train() di Sel 6 rdd-yolov11s.ipynb  -> nilai yang
#      ditulis eksplisit di baris di bawah (model, epochs, imgsz, batch,
#      patience, seed, cos_lr, mixup, copy_paste, save_period, name, project).
#   2. args.yaml run baseline YOLOv11n (ultralytics 8.4.138) -> SEMUA parameter
#      lain yang TIDAK ditulis eksplisit, jadi memakai nilai default.
#   3. Header keluaran Sel 7 -> versi Ultralytics 8.4.142 (baseline 8.4.138),
#      torch 2.10.0+cu128, Tesla T4, 9.414.735 parameter, 21.4 GFLOPs.
#
# CATATAN PENTING
#   - Versi ultralytics berbeda 4 patch (8.4.142 vs 8.4.138). Bila default
#     berubah di antara keduanya, nilai warisan pada baris lain bisa stale.
#     Verifikasi dengan menjalankan ulang training lalu bandingkan args.yaml asli.
#   - Baris bertanda "# DARI TRAIN()" /= bukti langsung.
#     Baris lain diwarisi dari baseline v11n dan belum diverifikasi per-run.
#   - Training dihentikan early-stop pada epoch 131
#     dari 200 (patience 40), jadi epoch 'best' = 91.
#   - Epoch 87-92 dan 131 punya metrik identik di log (presisi 3 desimal),
#     sehingga epoch best tidak bisa dibaca dari log. Angka 91
#     berasal dari aritmetika patience, bukan dari log.
# =====================================================================

